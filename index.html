<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Balloon Pop!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <h1>🎈 Balloon Pop! 🎈</h1>
        <button id="play-button">PLAY</button>
        <button id="mute-button">🔊 Sound ON</button>
    </div>
    
    <div id="game-screen" style="display: none;">
        <div id="score-bar">
            <div id="score-display">Score: <span id="score">0</span></div>
            <div id="lives-display">Lives: <span id="lives">3</span></div>
            <button id="pause-button">⏸️</button>
        </div>
        <div id="game-area"></div>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>Game Over!</h1>
        <div id="final-score-display">Final Score: <span id="final-score">0</span></div>
        <div id="new-high-score-message" style="display: none;">🎉 New High Score! 🎉</div>
        <div id="initials-prompt" style="display: none;">
            <p>Enter your initials:</p>
            <input type="text" id="initials-input" maxlength="3" placeholder="ABC" />
            <button id="submit-initials">Submit</button>
        </div>
        <div id="leaderboard">
            <h2>Top 5 High Scores</h2>
            <div id="leaderboard-list"></div>
        </div>
        <button id="play-again-button">Play Again</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
